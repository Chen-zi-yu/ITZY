<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZY 周邊 & 專輯搜尋庫</title>
    <style>
        :root {
            --primary-color: #e11d48;
            --primary-hover: #be123c;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'PingFang TC', 'Heiti TC', 'Segoe UI', Arial, sans-serif;
            max-width: 1200px;    
            margin: 0 auto 60px auto;
            padding: 0 24px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* 🔔 新增：跑馬燈樣式 (初始隱藏) */
        .notice-bar {
            background-color: #fff1f2; color: var(--primary-color); padding: 10px 0;
            overflow: hidden; white-space: nowrap; font-size: 0.9rem; font-weight: 600;
            border-bottom: 1px solid #ffe4e6; position: sticky; top: 0; z-index: 9999;
            display: none; width: 100%; box-sizing: border-box;
        }
        .notice-bar span { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* 🔔 新增：彈出視窗樣式 */
        .notice-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 10000;
        }
        .notice-box { background: white; width: 90%; max-width: 450px; padding: 30px; border-radius: 24px; text-align: center; }
        .notice-btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 30px; border-radius: 50px; cursor: pointer; font-weight: 700; margin-top: 15px; }

        /* 🔔 新增：懸浮回饋按鈕 */
        .feedback-float-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background-color: var(--primary-color); color: white; border: none; font-size: 24px; cursor: pointer; z-index: 9998; box-shadow: 0 10px 15px rgba(225, 29, 72, 0.3); }
        .feedback-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .feedback-box { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 20px; text-align: center; }
        textarea { width: 100%; height: 100px; margin-top: 10px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px; box-sizing: border-box; }
        .btn-submit { background: var(--primary-color); color: white; border: none; padding: 10px 25px; border-radius: 50px; cursor: pointer; margin-top: 15px; }

        /* 原有設計 */
        .header-section { text-align: center; padding: 50px 0 30px 0; }
        h1 { color: var(--primary-color); font-size: 2.8rem; font-weight: 800; margin-bottom: 8px; letter-spacing: 3px; text-shadow: 0 2px 4px rgba(225, 29, 72, 0.1); }
        .search-container { margin: 35px auto 0 auto; position: relative; max-width: 600px; }
        .search-input { width: 100%; padding: 16px 26px; border: 2px solid #e2e8f0; border-radius: 50px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 30px; margin-top: 40px; }
        .item-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
    </style>
</head>
<body>

<div class="notice-bar" id="noticeBar">
    <span>📢 本網站為個人非營利收藏紀錄，所有照片與素材皆來自網路公開資源，版權歸原創作者所有。本站內容禁止作為任何商業盈利用途。</span>
</div>

<div class="notice-overlay" id="noticeOverlay">
    <div class="notice-box">
        <h2 style="color:var(--primary-color)">📢 網站使用聲明</h2>
        <p style="text-align:left;">本網站為個人非營利收藏紀錄，所有照片與素材皆來自網路公開資源，版權歸原創作者所有。本站內容禁止作為任何商業盈利用途。進入網站即代表您同意本站規範。</p>
        <button class="notice-btn" id="agreeBtn">我已了解並同意</button>
    </div>
</div>

<button class="feedback-float-btn" id="openFeedbackBtn">💬</button>
<div class="feedback-overlay" id="feedbackOverlay" style="display: none;">
    <div class="feedback-box">
        <h3>💡 給我們意見</h3>
        <textarea id="feedbackText" placeholder="請輸入您的建議..."></textarea>
        <button type="button" class="btn-submit" style="background:#64748b" id="closeFeedbackBtn">取消</button>
        <button type="button" class="btn-submit" id="submitFeedback">送出</button>
    </div>
</div>

<div class="header-section">
    <h1>ITZY! MIDZY! 날자!</h1>
    <div class="header-subtitle">ITZY 專輯與周邊收藏實拍紀錄庫</div>
</div>

<div class="search-container">
    <input type="text" id="searchBox" class="search-input" placeholder="🔍 輸入關鍵字搜尋專輯或官方周邊...">
</div>

<div class="grid-container" id="productsGrid"></div>

<script>
    // 1. 同意後邏輯
    document.getElementById('agreeBtn').onclick = () => {
        document.getElementById('noticeOverlay').style.display = 'none';
        document.getElementById('noticeBar').style.display = 'block';
    };

    // 2. 回饋功能
    document.getElementById('openFeedbackBtn').onclick = () => document.getElementById('feedbackOverlay').style.display = 'flex';
    document.getElementById('closeFeedbackBtn').onclick = () => document.getElementById('feedbackOverlay').style.display = 'none';
    
    document.getElementById('submitFeedback').onclick = () => {
        const text = document.getElementById('feedbackText').value;
        // 請將此處 email 換成你的
        window.location.href = `mailto:你的信箱@example.com?subject=ITZY網站意見回饋&body=${encodeURIComponent(text)}`;
        document.getElementById('feedbackOverlay').style.display = 'none';
    };

    // 3. 原有商品邏輯
    const itzyDatabase = [
        {id: "motto", title: "Motto (Mini Album)", type: "album", typeName: "官方專輯", date: "2026.05.18", desc: "ITZY 的第十二張迷你專輯。", image: "./Motto/Motto.jpg"},
        {id: "lightring", title: "ITZY 官方應援棒 Ver.2", type: "goods", typeName: "官方周邊", date: "官方常售商品", desc: "精緻環形應援燈。", image: "./Motto/lightring_1.jpg"}
    ];
    
    function renderItems(items) {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = items.map(item => `
            <div class="item-card">
                <a class="img-link" href="detail.html?id=${item.id}"><img src="${item.image}" style="width:100%; height:260px; object-fit:cover;"></a>
                <div class="item-info" style="padding:20px"><h3>${item.title}</h3><p>${item.desc}</p></div>
            </div>
        `).join('');
    }
    renderItems(itzyDatabase);
</script>

</body>
</html>
