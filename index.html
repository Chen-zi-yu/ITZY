<style>
        :root {
            --primary-color: #e11d48;
            --primary-hover: #be123c;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'PingFang TC', 'Heiti TC', 'Segoe UI', Arial, sans-serif;
            max-width: 1200px;    /* 👈 修改：原本是 1000px，改為 1200px 讓網頁整體變寬 */
            margin: 0 auto 60px auto;
            padding: 0 24px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* 標頭美化 */
        .header-section { 
            text-align: center; 
            padding: 50px 0 30px 0; 
        }
        h1 { 
            color: var(--primary-color); 
            font-size: 2.8rem; 
            font-weight: 800;
            margin-bottom: 8px; 
            letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(225, 29, 72, 0.1);
        }
        .header-subtitle {
            color: var(--text-muted); 
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* 搜尋框美化 */
        .search-container { 
            margin: 35px auto 0 auto; 
            position: relative; 
            max-width: 600px; /* 👈 修改：稍微加寬搜尋框搭配整體格局 */
        }
        .search-input { 
            width: 100%; 
            padding: 16px 26px; 
            font-size: 1.05rem; 
            border: 2px solid #e2e8f0; 
            border-radius: 50px; 
            outline: none; 
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-input:focus { 
            border-color: var(--primary-color); 
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.12);
            transform: translateY(-2px);
        }

        .status-text { 
            text-align: center; 
            color: var(--text-muted); 
            margin-bottom: 35px; 
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* 商品網格與卡片 */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* 👈 修改：稍微加寬卡片網格 */
            gap: 30px; 
        }
        .item-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.03), 0 1px 4px rgba(15, 23, 42, 0.02);
            border: 1px solid #f1f5f9; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; 
            flex-direction: column; 
        }
        .item-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 10px 10px -5px rgba(15, 23, 42, 0.04);
            border-color: #e2e8f0;
        }
        
        .img-link { 
            width: 100%; 
            height: 300px; /* 👈 修改：加高卡片圖片高度 */
            overflow: hidden; 
            display: block; 
            cursor: pointer; 
            background-color: #f1f5f9;
        }
        .img-link img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .item-card:hover .img-link img { 
            transform: scale(1.06); 
        }

        .item-info { 
            padding: 24px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
        }
        .item-type { 
            align-self: flex-start; 
            font-size: 0.75rem; 
            font-weight: 700; 
            padding: 6px 12px; 
            border-radius: 30px; 
            margin-bottom: 14px; 
            letter-spacing: 0.5px;
        }
        .type-album { background-color: #ffe4e6; color: #f43f5e; }
        .type-goods { background-color: #e0f2fe; color: #0284c7; }
        
        .item-title { 
            font-size: 1.25rem; 
            font-weight: 700; 
            margin: 0 0 8px 0; 
            color: var(--text-main);
        }
        .item-date { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-bottom: 12px; 
            font-weight: 500;
        }
        .item-desc { 
            font-size: 0.92rem; 
            color: #475569; 
            line-height: 1.6; 
            margin: 0; 
        }
        .no-results { 
            grid-column: 1 / -1; 
            text-align: center; 
            padding: 60px 0; 
            color: var(--text-muted); 
            display: none; 
            font-size: 1.1rem;
        }

        /* ✨ 修改：自動輪播看板美化 */
        .slider-container {
            width: 100%;
            height: 600px; /* 👈 修改：原本是 400px，大幅拉高到 600px 讓畫面變大變寬 */
            margin-top: 25px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            background-color: #000;
        }
        .slider-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out; 
            z-index: 1;
        }
        .slider-item.active {
            opacity: 1;
            z-index: 2;
        }
        .slider-item img, .slider-item video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 👈 這個屬性是造成人物臉被切到的原因，但它能保證外框被填滿。我們需要更換圖片來配合它。 */
        }
    </style>
