<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZY 周邊 & 專輯搜尋庫</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
            background-color: #f9fafb;
            color: #111827;
        }
        .header-section { text-align: center; padding: 40px 0; }
        h1 { color: #e11d48; font-size: 2.5rem; margin-bottom: 10px; letter-spacing: 2px; }
        .search-container { margin-top: 25px; position: relative; max-width: 500px; margin-left: auto; margin-right: auto; }
        .search-input { width: 100%; padding: 14px 20px; font-size: 1.1rem; border: 2px solid #e5e7eb; border-radius: 30px; outline: none; }
        .search-input:focus { border-color: #e11d48; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.15); }
        .status-text { text-align: center; color: #6b7280; margin-bottom: 30px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .item-card { background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04); border: 1px solid #f3f4f6; transition: all 0.3s ease; display: flex; flex-direction: column; }
        .item-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08); }
        
        /* 讓圖片變成可以點擊的超連結 */
        .img-link { width: 100%; height: 260px; overflow: hidden; display: block; cursor: pointer; }
        .img-link img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .img-link:hover img { transform: scale(1.05); }

        .item-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .item-type { align-self: flex-start; font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; margin-bottom: 10px; }
        .type-album { background-color: #fee2e2; color: #ef4444; }
        .type-goods { background-color: #e0f2fe; color: #0284c7; }
        .item-title { font-size: 1.15rem; font-weight: bold; margin: 0 0 8px 0; }
        .item-date { font-size: 0.85rem; color: #9ca3af; margin-bottom: 10px; }
        .item-desc { font-size: 0.9rem; color: #4b5563; line-height: 1.5; margin: 0; }
        .no-results { grid-column: 1 / -1; text-align: center; padding: 50px 0; color: #9ca3af; display: none; }
    </style>
</head>
<body>

<div class="header-section">
    <h1>👑 ITZY ARCHIVE</h1>
    <p style="color: #4b5563; font-weight: 500;">專輯、周邊與官方商品即時搜尋庫</p>
    <div class="search-container">
        <input type="text" id="search-box" class="search-input" placeholder="輸入關鍵字... (如: Gold, 應援棒)">
    </div>
</div>

<div class="status-text" id="status-count">正在載入資料...</div>

<div class="grid-container" id="products-grid">
    <div id="no-data-msg" class="no-results">🔍 找不到相符的周邊或專輯資訊。</div>
</div>

<script>
    // 給每筆資料一個獨一無二的 id，並在 moreImages 陣列放你想在內頁展示的其他圖片
    const itzyDatabase = [
        {
            id: "motto",
            title: "Motto (Mini Album)",
            type: "album",
            typeName: "官方專輯",
            date: "2026.05.18",
            desc: "ITZY 的第十二張迷你專輯",
            image: "./Motto/motto.jpg", // 主頁封面圖
            moreImages: ["Motto/pop_up store1.jpg", "Motto/pop_up store2.jpg"] // 點進去內頁想顯示的所有圖片
        },
        {
            id: "lightring",
            title: "ITZY 官方應援棒 Ver.2",
            type: "goods",
            typeName: "官方周邊",
            date: "官方常售商品",
            desc: "別具特色的環形應援燈二代！支援中控幻彩變色。",
            image: "Motto/lightring_1.jpg",
            moreImages: ["Motto/lightring_1.jpg", "Motto/lightring_2.jpg", "Motto/lightring_box.jpg"]
        }
    ];

    const searchBox = document.getElementById('search-box');
    const productsGrid = document.getElementById('products-grid');
    const statusCount = document.getElementById('status-count');
    const noDataMsg = document.getElementById('no-data-msg');

    function renderItems(items) {
        const cards = productsGrid.querySelectorAll('.item-card');
        cards.forEach(card => card.remove());
        statusCount.innerText = `目前顯示： ${items.length} 筆資料`;

        if (items.length === 0) {
            noDataMsg.style.display = 'block';
            return;
        }
        noDataMsg.style.display = 'none';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';

            // 💡 關鍵：將圖片用 <a> 標籤包起來，點擊時會導向 detail.html?id=商品id
            card.innerHTML = `
                <a class="img-link" href="detail.html?id=${item.id}">
                    <img src="${item.image}" alt="${item.title}">
                </a>
                <div class="item-info">
                    <span class="item-type type-${item.type}">${item.typeName}</span>
                    <h3 class="item-title">${item.title}</h3>
                    <div class="item-date">日期: ${item.date}</div>
                    <p class="item-desc">${item.desc}</p>
                </div>
            `;
            productsGrid.appendChild(card);
        });
    }

    searchBox.addEventListener('input', (event) => {
        const keyword = event.target.value.toLowerCase().trim();
        const filteredData = itzyDatabase.filter(item => {
            return item.title.toLowerCase().includes(keyword) || item.desc.toLowerCase().includes(keyword);
        });
        renderItems(filteredData);
    });

    renderItems(itzyDatabase);
</script>

</body>
</html>
