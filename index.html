<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZY 周邊 & 專輯搜尋庫</title>
    <style>
        :root {
            --primary-color: #e11d48;
            --primary-hover: #be123c;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'PingFang TC', 'Heiti TC', 'Segoe UI', Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto 60px auto;
            padding: 0 24px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* 標頭美化 */
        .header-section { 
            text-align: center; 
            padding: 50px 0 30px 0; 
        }
        h1 { 
            color: var(--primary-color); 
            font-size: 2.8rem; 
            font-weight: 800;
            margin-bottom: 8px; 
            letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(225, 29, 72, 0.1);
        }
        .header-subtitle {
            color: var(--text-muted); 
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* 搜尋框美化 (現代微發光效果) */
        .search-container { 
            margin: 35px auto 0 auto; 
            position: relative; 
            max-width: 540px; 
        }
        .search-input { 
            width: 100%; 
            padding: 16px 26px; 
            font-size: 1.05rem; 
            border: 2px solid #e2e8f0; 
            border-radius: 50px; 
            outline: none; 
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-input:focus { 
            border-color: var(--primary-color); 
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.12);
            transform: translateY(-2px);
        }

        .status-text { 
            text-align: center; 
            color: var(--text-muted); 
            margin-bottom: 35px; 
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* 商品網格與卡片美化 */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
        }
        .item-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.03), 0 1px 4px rgba(15, 23, 42, 0.02);
            border: 1px solid #f1f5f9; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; 
            flex-direction: column; 
        }
        .item-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 10px 10px -5px rgba(15, 23, 42, 0.04);
            border-color: #e2e8f0;
        }
        
        .img-link { 
            width: 100%; 
            height: 280px; 
            overflow: hidden; 
            display: block; 
            cursor: pointer; 
            background-color: #f1f5f9;
        }
        .img-link img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .item-card:hover .img-link img { 
            transform: scale(1.06); 
        }

        .item-info { 
            padding: 24px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
        }
        .item-type { 
            align-self: flex-start; 
            font-size: 0.75rem; 
            font-weight: 700; 
            padding: 6px 12px; 
            border-radius: 30px; 
            margin-bottom: 14px; 
            letter-spacing: 0.5px;
        }
        .type-album { background-color: #ffe4e6; color: #f43f5e; }
        .type-goods { background-color: #e0f2fe; color: #0284c7; }
        
        .item-title { 
            font-size: 1.25rem; 
            font-weight: 700; 
            margin: 0 0 8px 0; 
            color: var(--text-main);
        }
        .item-date { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-bottom: 12px; 
            font-weight: 500;
        }
        .item-desc { 
            font-size: 0.92rem; 
            color: #475569; 
            line-height: 1.6; 
            margin: 0; 
        }
        .no-results { 
            grid-column: 1 / -1; 
            text-align: center; 
            padding: 60px 0; 
            color: var(--text-muted); 
            display: none; 
            font-size: 1.1rem;
        }

        /* 自動輪播看版美化 */
        .slider-container {
            width: 100%;
            height: 400px; 
            margin-top: 25px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            background-color: #000;
        }
        .slider-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out; 
            z-index: 1;
        }
        .slider-item.active {
            opacity: 1;
            z-index: 2;
        }
        .slider-item img, .slider-item video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }
    </style>
</head>
<body>

<div class="header-section">
    <h1>👑 ITZY MIDZY 날자</h1>
    <p class="header-subtitle">專輯、周邊與官方商品即時搜尋庫</p>

    <div class="slider-container" id="hero-slider"></div>

    <div class="search-container">
        <input type="text" id="search-box" class="search-input" placeholder="輸入關鍵字搜尋... (如: Gold, 應援棒)">
    </div>
</div>

<div class="status-text" id="status-count">正在載入資料...</div>

<div class="grid-container" id="products-grid">
    <div id="no-data-msg" class="no-results">🔍 找不到相符的周邊或專輯資訊。</div>
</div>

<script>
    const bannerMediaFiles = [
        "./video/IMG_4869.jpg",              
        "./video/IMG_4926.jpg",      
        "./video/IMG_4923.jpg",      
        /* "./Motto/itzy_teaser.mp4",       */  
        "./video/IMG_4928.jpg", 
        "./video/IMG_4932.jpg", 
        "./video/IMG_4933.jpg",
        "./video/IMG_4934.jpg"
    ];

    const itzyDatabase = [
        {
            id: "motto",
            title: "Motto (Mini Album)",
            type: "album",
            typeName: "官方專輯",
            date: "2026.05.18",
            desc: "ITZY 的第十二張迷你專輯",
            image: "./Motto/Motto.jpg"
        },
        {
            id: "lightring",
            title: "ITZY 官方應援棒 Ver.2",
            type: "goods",
            typeName: "官方周邊",
            date: "官方常售商品",
            desc: "別具特色的環形應援燈二代！支援中控幻彩變色。",
            image: "./Motto/lightring_1.jpg"
        }
    ];

    // 隨機洗牌演算法 (隨機播放)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }
    shuffleArray(bannerMediaFiles);

    // 初始化輪播
    const heroSlider = document.getElementById('hero-slider');
    bannerMediaFiles.forEach((src, index) => {
        const slide = document.createElement('div');
        slide.className = `slider-item ${index === 0 ? 'active' : ''}`;
        
        if (src.toLowerCase().endsWith('.mp4')) {
            slide.innerHTML = `<video src="${src}" autoplay loop muted playsinline></video>`;
        } else {
            slide.innerHTML = `<img src="${src}" alt="Banner">`;
        }
        heroSlider.appendChild(slide);
    });

    let currentSlide = 0;
    const slides = document.querySelectorAll('.slider-item');
    
    if(slides.length > 0) {
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
            
            const video = slides[currentSlide].querySelector('video');
            if(video) { video.play(); }
        }, 4000); 
    }

    // 搜尋與渲染
    const searchBox = document.getElementById('search-box');
    const productsGrid = document.getElementById('products-grid');
    const statusCount = document.getElementById('status-count');
    const noDataMsg = document.getElementById('no-data-msg');

    function renderItems(items) {
        const cards = productsGrid.querySelectorAll('.item-card');
        cards.forEach(card => card.remove());
        statusCount.innerText = `目前顯示： ${items.length} 筆資料`;

        if (items.length === 0) {
            noDataMsg.style.display = 'block';
            return;
        }
        noDataMsg.style.display = 'none';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';

            card.innerHTML = `
                <a class="img-link" href="detail.html?id=${item.id}">
                    <img src="${item.image}" alt="${item.title}">
                </a>
                <div class="item-info">
                    <span class="item-type type-${item.type}">${item.typeName}</span>
                    <h3 class="item-title">${item.title}</h3>
                    <div class="item-date">日期: ${item.date}</div>
                    <p class="item-desc">${item.desc}</p>
                </div>
            `;
            productsGrid.appendChild(card);
        });
    }

    searchBox.addEventListener('input', (event) => {
        const keyword = event.target.value.toLowerCase().trim();
        const filteredData = itzyDatabase.filter(item => {
            return item.title.toLowerCase().includes(keyword) || item.desc.toLowerCase().includes(keyword);
        });
        renderItems(filteredData);
    });

    renderItems(itzyDatabase);
</script>

</body>
</html>
