<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZY 周邊 & 專輯搜尋庫</title>
    <style>
        :root {
            --primary-color: #e11d48;
            --primary-hover: #be123c;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'PingFang TC', 'Heiti TC', 'Segoe UI', Arial, sans-serif;
            max-width: 1200px;    
            margin: 0 auto 60px auto;
            padding: 0 24px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* 標頭美化 */
        .header-section { 
            text-align: center; 
            padding: 50px 0 30px 0; 
        }
        h1 { 
            color: var(--primary-color); 
            font-size: 2.8rem; 
            font-weight: 800;
            margin-bottom: 8px; 
            letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(225, 29, 72, 0.1);
        }
        .header-subtitle {
            color: var(--text-muted); 
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* 搜尋框美化 */
        .search-container { 
            margin: 35px auto 0 auto; 
            position: relative; 
            max-width: 600px; 
        }
        .search-input { 
            width: 100%; 
            padding: 16px 26px; 
            font-size: 1.05rem; 
            border: 2px solid #e2e8f0; 
            border-radius: 50px; 
            outline: none; 
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-input:focus { 
            border-color: var(--primary-color); 
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.12);
            transform: translateY(-2px);
        }

        .status-text { 
            text-align: center; 
            color: var(--text-muted); 
            margin-bottom: 35px; 
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* 🛍️ 商品網格佈局：寬度調整 */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); 
            gap: 30px; 
        }
        .item-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.03), 0 1px 4px rgba(15, 23, 42, 0.02);
            border: 1px solid #f1f5f9; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; 
            flex-direction: column; 
        }
        .item-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 10px 10px -5px rgba(15, 23, 42, 0.04);
            border-color: #e2e8f0;
        }
        
        /* 🖼️ 照片外框比例 */
        .img-link { 
            width: 100%; 
            height: 260px; 
            overflow: hidden; 
            display: block; 
            cursor: pointer; 
            background-color: #f1f5f9;
        }
        .img-link img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .item-card:hover .img-link img { 
            transform: scale(1.06); 
        }

        .item-info { 
            padding: 24px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
        }
        .item-type { 
            align-self: flex-start; 
            font-size: 0.75rem; 
            font-weight: 700; 
            padding: 6px 12px; 
            border-radius: 30px; 
            margin-bottom: 14px; 
            letter-spacing: 0.5px;
        }
        .type-album { background-color: #ffe4e6; color: #f43f5e; }
        .type-goods { background-color: #e0f2fe; color: #0284c7; }
        
        .item-title { 
            font-size: 1.25rem; 
            font-weight: 700; 
            margin: 0 0 8px 0; 
            color: var(--text-main);
        }
        .item-date { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-bottom: 12px; 
            font-weight: 500;
        }
        .item-desc { 
            font-size: 0.92rem; 
            color: #475569; 
            line-height: 1.6; 
            margin: 0; 
        }
        .no-results { 
            grid-column: 1 / -1; 
            text-align: center; 
            padding: 60px 0; 
            color: var(--text-muted); 
            display: none; 
            font-size: 1.1rem;
        }

        /* 🎡 輪播看板美化：寬度縮窄、直向拉高 */
        .slider-container {
            width: 100%;
            max-width: 850px;    
            height: 520px;       
            margin: 25px auto 0 auto; 
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            background-color: #000;
            cursor: pointer; 
        }
        .slider-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out; 
            z-index: 1;
        }
        .slider-item.active {
            opacity: 1;
            z-index: 2;
        }
        .slider-item img, .slider-item video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center center; 
        }
    </style>
</head>
<body>

<div class="header-section">
    <h1>ITZY! MIDZY! 날자!</h1>
    <div class="header-subtitle">ITZY 專輯與周邊收藏實拍紀錄庫</div>
</div>

<div class="slider-container" id="slider">
</div>

<div class="search-container">
    <input type="text" id="searchBox" class="search-input" placeholder="🔍 輸入關鍵字搜尋專輯或官方周邊...">
</div>

<div class="status-text" id="statusCount">目前顯示： 0 筆資料</div>

<div class="grid-container" id="productsGrid">
    <div class="no-results" id="noDataMsg">❌ 找不到相符的周邊商品，換個關鍵字試試吧！</div>
</div>

<script>
    // 💡 輪播資料庫
    const bannerMediaFiles = [
        { 
            url: "./video/IMG_4869.jpg", 
            objectPosition: "center center", 
            filter: "brightness(1)",         
            link: "detail.html?id=motto"     
        },              
        { 
            url: "./video/IMG_4870.jpg", 
            objectPosition: "center 0%", 
            filter: "brightness(1)",
            link: "" 
        },
        { 
            url: "./video/IMG_4923.jpg", 
            objectPosition: "center center", 
            filter: "brightness(1)",
            link: "" 
        },
        { 
            url: "./video/IMG_4926.jpg", 
            objectPosition: "center center", 
            filter: "brightness(1)",
            link: "" 
        },
        { 
            url: "./video/IMG_4928.jpg", 
            objectPosition: "center center", 
            filter: "brightness(1)",
            link: "" 
        },
        { 
            url: "./video/IMG_4932.jpg", 
            objectPosition: "center 0%", 
            filter: "brightness(1)",
            link: "" 
        },
        { 
            url: "./video/IMG_4933.jpg", 
            objectPosition: "center 30%", 
            filter: "brightness(1)",
            link: "" 
        },
        { 
            url: "./video/IMG_4934.jpg", 
            objectPosition: "center 0%", 
            filter: "brightness(1)",
            link: "" 
        }
    ];

    // 💡 商品核心資料庫
    const itzyDatabase = [
        {
            id: "motto",
            title: "Motto (Mini Album)",
            type: "album",
            typeName: "官方專輯",
            date: "2026.05.18",
            desc: "ITZY 的第十二張迷你專輯。",
            image: "./Motto/Motto.jpg"  
        },
        {
            id: "lightring",
            title: "ITZY 官方應援棒 Ver.2",
            type: "goods",
            typeName: "官方周邊",
            date: "官方常售商品",
            desc: "別具特色的環形應援燈二代！支援中控幻彩變色與精緻外盒包裝。",
            image: "./Motto/lightring_1.jpg" 
        }
    ];

    // ====== 1. 隨機播放輪播功能邏輯 ======
    const sliderContainer = document.getElementById('slider');
    const firstActiveIndex = Math.floor(Math.random() * bannerMediaFiles.length);

    bannerMediaFiles.forEach((fileObj, index) => {
        const item = document.createElement('div');
        item.className = index === firstActiveIndex ? 'slider-item active' : 'slider-item';
        
        let mediaHtml = "";
        if (fileObj.url.endsWith('.mp4')) {
            mediaHtml = `<video src="${fileObj.url}" autoplay loop muted playsinline></video>`;
        } else {
            mediaHtml = `<img src="${fileObj.url}" alt="Banner ${index + 1}">`;
        }

        item.innerHTML = mediaHtml;

        const mediaElement = item.querySelector('img, video');
        if (mediaElement) {
            if (fileObj.objectPosition) mediaElement.style.objectPosition = fileObj.objectPosition;
            if (fileObj.filter) mediaElement.style.filter = fileObj.filter;
        }

        sliderContainer.appendChild(item);
    });

    let currentSlide = firstActiveIndex;
    const slides = document.querySelectorAll('.slider-item');
    let slideTimer = null; 

    // 💡 切換下一張隨機圖片邏輯
    function changeToNextRandomSlide() {
        slides[currentSlide].classList.remove('active');
        let nextSlide;
        do {
            nextSlide = Math.floor(Math.random() * slides.length);
        } while (nextSlide === currentSlide);
        currentSlide = nextSlide;
        slides[currentSlide].classList.add('active');
    }

    // 💡 啟動自動輪播計時器
    function startAutoSlide() {
        if (slides.length > 1) {
            slideTimer = setInterval(() => {
                changeToNextRandomSlide();
            }, 4000); 
        }
    }

    // 💡 重置計時器
    function resetSlideTimer() {
        clearInterval(slideTimer);
        startAutoSlide();
    }

    // 💡 【修正：移除點擊跳轉】現在首頁輪播純粹用來切換下一張圖，永遠不會意外跳轉內頁
    sliderContainer.addEventListener('click', (e) => {
        changeToNextRandomSlide();
        resetSlideTimer();
    });

    // 初始化自動輪播
    startAutoSlide();

    // ====== 2. 搜尋與商品網格渲染邏輯 ======
    const productsGrid = document.getElementById('productsGrid');
    const searchBox = document.getElementById('searchBox');
    const statusCount = document.getElementById('statusCount');
    const noDataMsg = document.getElementById('noDataMsg');

    function renderItems(items) {
        const cards = productsGrid.querySelectorAll('.item-card');
        cards.forEach(card => card.remove());
        statusCount.innerText = `目前顯示： ${items.length} 筆資料`;

        if (items.length === 0) {
            noDataMsg.style.display = 'block';
            return;
        }
        noDataMsg.style.display = 'none';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';

            card.innerHTML = `
                <a class="img-link" href="detail.html?id=${item.id}">
                    <img src="${item.image}" alt="${item.title}">
                </a>
                <div class="item-info">
                    <span class="item-type type-${item.type}">${item.typeName}</span>
                    <h3 class="item-title">${item.title}</h3>
                    <div class="item-date">日期: ${item.date}</div>
                    <p class="item-desc">${item.desc}</p>
                </div>
            `;
            productsGrid.appendChild(card);
        });
    }

    searchBox.addEventListener('input', (event) => {
        const keyword = event.target.value.toLowerCase().trim();
        const filteredData = itzyDatabase.filter(item => {
            return item.title.toLowerCase().includes(keyword) || item.desc.toLowerCase().includes(keyword);
        });
        renderItems(filteredData);
    });

    renderItems(itzyDatabase);
</script>

</body>
</html>
