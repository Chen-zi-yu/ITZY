<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZY 周邊詳情展示</title>
    <style>
        /* --- 全域變數定義 --- */
        :root { --primary-color: #e11d48; --bg-color: #f8fafc; --text-main: #0f172a; --text-muted: #64748b; }
        
        /* --- 網頁基本字型與佈局 --- */
        body { 
            font-family: 'Times New Roman', Times, 'DFKai-SB', 'BiauKai', '標楷體', KaiTi, serif; 
            max-width: 850px; margin: 0 auto 50px auto; padding: 24px; 
            background-color: var(--bg-color); color: var(--text-main); 
        }

        /* --- 圖片燈箱效果樣式 --- */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none;
            justify-content: center; align-items: center; z-index: 10000; cursor: pointer;
        }
        #lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        /* --- 頂部跑馬燈公告樣式 --- */
        .notice-bar {
            background-color: #fff1f2; color: var(--primary-color); padding: 10px 0;
            overflow: hidden; white-space: nowrap; font-size: 0.9rem; font-weight: 600;
            border-bottom: 1px solid #ffe4e6; position: relative;
            display: none; width: 100vw; margin-left: calc(-50vw + 50%); box-sizing: border-box; margin-bottom: 20px;
        }
        .notice-bar span { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* --- 側邊主選單樣式 --- */
        .side-menu-toggle {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: var(--primary-color);
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 14px 25px rgba(15, 23, 42, 0.18);
            z-index: 10001;
        }
        .side-menu-panel {
            position: absolute;
            top: 68px;
            left: 0;
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15,23,42,0.16);
            z-index: 10000;
            min-width: 180px;
            backdrop-filter: blur(12px);
        }
        .side-menu-panel.open { display: flex; }
        .side-menu-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 16px;
            border: none;
            background: #fff;
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 18px rgba(15, 23, 42, 0.08);
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .side-menu-btn:hover { transform: translateX(3px); background: #f8fafc; }

        .panel-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 10000; justify-content: center; align-items: center; }
        .panel-box { background: white; width: 92%; max-width: 500px; padding: 28px; border-radius: 24px; text-align: left; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18); }
        .panel-box h3 { margin-top: 0; color: var(--primary-color); }
        .panel-close { display: inline-flex; margin-top: 20px; justify-content: center; width: 100%; padding: 12px 0; border-radius: 999px; border: none; background: var(--primary-color); color: white; font-weight: 700; cursor: pointer; }

        .feedback-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 10000;
        }
        .feedback-box {
            background: white; width: 90%; max-width: 450px; padding: 30px; border-radius: 24px; text-align: center; font-weight: bold;
        }
        textarea { width: 100%; height: 100px; margin-top: 10px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px; box-sizing: border-box; resize: none; font-family: inherit; }
        .btn-submit { background: var(--primary-color); color: white; border: none; padding: 10px 25px; border-radius: 50px; cursor: pointer; margin-top: 15px; font-family: inherit; font-weight: bold; }

        /* --- 返回列表按鈕樣式 --- */
        .back-btn { display: inline-flex; align-items: center; margin-bottom: 25px; color: var(--text-muted); text-decoration: none; font-weight: 600; padding: 10px 20px; background: white; border-radius: 50px; border: 1px solid #e2e8f0; transition: all 0.3s; font-family: inherit; }
        .back-btn:hover { color: var(--primary-color); border-color: var(--primary-color); transform: translateX(-4px); }
        
        /* --- 詳細內容卡片樣式 --- */
        .detail-card { background: white; border-radius: 24px; padding: 35px; box-shadow: 0 10px 30px rgba(15,23,42,0.04); border: 1px solid #e2e8f0; }
        
        /* --- 封面圖容器樣式 --- */
        .detail-cover-container { width: 100%; height: 400px; border-radius: 16px; overflow: hidden; margin-bottom: 30px; background-color: #f1f5f9; }
        .detail-cover-container img { width: 100%; height: 100%; object-fit: cover; object-position: center; }

        /* --- 標題、說明與分類區塊樣式 --- */
        h1 { font-size: 2.2rem; font-weight: 800; margin: 0 0 15px 0; }
        .description { color: #475569; margin: 0; }
        .section-title { font-size: 1.4rem; font-weight: 700; margin: 40px 0 20px 0; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        
        /* --- 分類卡片樣式 --- */
        .album-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; transition: all 0.4s; }
        .album-card.is-clickable { cursor: pointer; }
        .album-card.is-clickable:hover { transform: translateY(-6px); border-color: var(--primary-color); }
        .album-cover-wrap { width: 100%; height: 400px; overflow: hidden; position: relative; }
        .album-cover-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
        .folder-badge { position: absolute; top: 12px; left: 12px; background: rgba(15,23,42,0.75); color: white; padding: 4px 10px; border-radius: 30px; font-size: 0.75rem; z-index: 1; }
        .album-info { padding: 18px; }
        .album-name { font-size: 1.1rem; font-weight: 700; margin: 0; }
    </style>
</head>
<body>

<div class="notice-bar" id="noticeBar">
    <span>📢 本網站為個人非營利收藏紀錄，所有照片與素材皆來自網路公開資源，版權歸原創作者所有。本站內容禁止作為任何商業盈利用途。</span>
</div>

<button class="side-menu-toggle" id="toggleSideMenu" aria-expanded="false" aria-controls="sideMenuPanel">☰</button>
<div class="side-menu-panel" id="sideMenuPanel">
    <button class="side-menu-btn" id="openPhotosBtn">🖼️ 提供照片</button>
    <button class="side-menu-btn" id="openNoticeBtn">📢 公告</button>
    <button class="side-menu-btn" id="openFeedbackBtn">💬 意見回饋</button>
</div>

<div class="panel-overlay" id="photosPanel">
    <div class="panel-box">
        <h3>📷 提供照片</h3>
        <p>歡迎透過以下方式提供最新照片或補充素材。</p>
        <div style="margin-top:18px; display:flex; flex-direction:column; gap:12px;">
            <a href="https://discord.gg/uqtb7NsheK" target="_blank" style="display:inline-flex; justify-content:center; padding:12px 16px; border-radius:16px; background:var(--primary-color); color:white; text-decoration:none; font-weight:700;">加入 Discord 提供照片</a>
            <p style="color: var(--text-muted); font-size:0.95rem;">或直接在 Discord 群組留言，讓我們能更快補上內容。</p>
        </div>
        <button class="panel-close" onclick="closePanel('photosPanel')">關閉</button>
    </div>
</div>

<div class="panel-overlay" id="noticePanel">
    <div class="panel-box">
        <h3>📢 公告</h3>
        <p>本網站為個人非營利收藏紀錄，所有照片與素材皆來自網路公開資源，版權歸原創作者所有。</p>
        <ul style="margin:16px 0 0 18px; color: var(--text-muted);">
            <li>禁止將內容用於任何商業盈利用途。</li>
            <li>若需補充照片或修正資料，歡迎透過意見回饋告知。</li>
        </ul>
        <button class="panel-close" onclick="closePanel('noticePanel')">關閉</button>
    </div>
</div>

<div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-box">
        <h3>💡 意見回饋</h3>
        <textarea id="feedbackText" placeholder="請輸入您的建議..."></textarea>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button type="button" class="btn-submit" style="background:#64748b" id="closeFeedbackBtn">取消</button>
            <button type="button" class="btn-submit" id="submitFeedback">送出</button>
        </div>
    </div>
</div>

<div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="" alt="放大預覽">
</div>

<a href="index.html" class="back-btn">⬅️ 返回商品列表</a>

<div class="detail-card">
    <div class="detail-cover-container">
        <img id="cover-img" src="" alt="商品封面圖" style="display: none;">
    </div>
    <h1 id="title">正在載入商品...</h1>
    <p id="desc" class="description"></p>
    
    <div class="section-title">📸 點擊進入分類</div>
    <div id="gallery" class="gallery-grid"></div>
</div>

<script>
    /* 頁面載入時檢查是否已同意過網站聲明 */
    window.addEventListener('DOMContentLoaded', () => {
        if (sessionStorage.getItem('itzy_notice_agreed') === 'true') {
            document.getElementById('noticeBar').style.display = 'block';
        }
    });

    const sideMenuPanel = document.getElementById('sideMenuPanel');
    const sideMenuToggle = document.getElementById('toggleSideMenu');
    function closeSideMenu() {
        sideMenuPanel.classList.remove('open');
        sideMenuToggle.setAttribute('aria-expanded', 'false');
    }
    sideMenuToggle.onclick = () => {
        const isOpen = sideMenuPanel.classList.toggle('open');
        sideMenuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    };
    document.getElementById('openPhotosBtn').onclick = () => {
        closeSideMenu();
        document.getElementById('photosPanel').style.display = 'flex';
    };
    document.getElementById('openNoticeBtn').onclick = () => {
        closeSideMenu();
        document.getElementById('noticePanel').style.display = 'flex';
    };
    document.getElementById('openFeedbackBtn').onclick = () => {
        closeSideMenu();
        document.getElementById('feedbackOverlay').style.display = 'flex';
    };
    document.getElementById('closeFeedbackBtn').onclick = () => document.getElementById('feedbackOverlay').style.display = 'none';

    function closePanel(panelId) {
        document.getElementById(panelId).style.display = 'none';
    }

    const detailDatabase = {
        "motto": {
            coverImage: "./Motto/Motto.jpg", 
            title: "Motto (Mini Album)",
            desc: "ITZY 的第十二張迷你專輯。",
            albums: [
                { id: "popup", name: "快閃店", cover: "./Motto/pop_up_store.jpg" },
                { id: "offline", name: "簽售特典卡、中簽卡、生日卡", cover: "./Motto/motto3.jpg" },
                { id: "album", name: "專輯配置", cover: "./Motto/motto2.jpg" }
            ]
        },
        "lightring": {
            coverImage: "./light/light_member.jpg",
            title: "ITZY 官方應援棒",
            desc: "打破傳統棒狀設計，採用獨一無二的「環狀（飛盤狀）」設計。",
            albums: [
                { id: "lightring1", name: "一代手燈", cover: "./light/lightring1.jpg" },
                { id: "lightring2", name: "二代手燈", cover: "./light/lightring2.jpg" },
                { id: "catear", name: "貓耳", cover: "./light/cat_ear.jpg" }
            ]
        },
	"gold": {
            coverImage: "./GOLD/GOLD.jpg",
            title: "GOLD (Mini Album)",
            desc: "ITZY 的第九張迷你專輯。",
            albums: [
                { id: "gold", name: "專輯配置", cover: "./GOLD/GOLD.jpg" }
            ]
        }
	/* 在此處以下新增資料 */
    };

    /* 獲取 URL 參數並讀取對應商品資料 */
    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get('id');
    const itemData = detailDatabase[targetId];

    /* 動態填充商品內容 */
    if (itemData) {
        if (itemData.coverImage) {
            const coverImg = document.getElementById('cover-img');
            coverImg.src = itemData.coverImage;
            coverImg.style.display = "block"; 
        }
        document.getElementById('title').innerText = itemData.title;
        document.getElementById('desc').innerText = itemData.desc;

        /* 生成分類畫廊 */
        const galleryContainer = document.getElementById('gallery');
        itemData.albums.forEach(album => {
            const card = document.createElement('div');
            const isClickable = targetId !== 'lightring';
            card.className = `album-card ${isClickable ? 'is-clickable' : ''}`;
            
            card.innerHTML = `
                <div class="album-cover-wrap">
                    <span class="folder-badge">${isClickable ? '📁 Album' : '🔍 點擊放大'}</span>
                    <img src="${album.cover}" alt="${album.name}">
                </div>
                <div class="album-info">
                    <h4 class="album-name">${album.name}</h4>
                </div>
            `;
            
            /* 設定點擊行為（導向分類頁或觸發燈箱） */
            if (isClickable) {
                card.addEventListener('click', () => {
                    window.location.href = `gallery.html?id=${targetId}&album=${album.id}`;
                });
            } else {
                card.addEventListener('click', () => {
                    document.getElementById('lightbox-img').src = album.cover;
                    document.getElementById('lightbox').style.display = 'flex';
                });
            }
            galleryContainer.appendChild(card);
        });
    } else {
        /* 處理找不到商品的情況 */
        document.getElementById('title').innerText = "抱歉，找不到該周邊的詳細資料。";
    }
</script>
</body>
</html>
