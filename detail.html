<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZY 周邊詳情展示</title>
    <style>
        :root { --primary-color: #e11d48; --bg-color: #f8fafc; --text-main: #0f172a; --text-muted: #64748b; }
        body { 
            /* 🎯 關鍵：英文 Times New Roman 排前面，中文標楷體排後面 */
            font-family: 'Times New Roman', Times, 'DFKai-SB', 'BiauKai', '標楷體', KaiTi, serif; 
            max-width: 850px; 
            margin: 0 auto 50px auto; 
            padding: 24px; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
        }
        .back-btn { display: inline-flex; align-items: center; margin-bottom: 25px; color: var(--text-muted); text-decoration: none; font-weight: 600; padding: 10px 20px; background: white; border-radius: 50px; border: 1px solid #e2e8f0; transition: all 0.3s; font-family: inherit; }
        .back-btn:hover { color: var(--primary-color); border-color: var(--primary-color); transform: translateX(-4px); }
        .detail-card { background: white; border-radius: 24px; padding: 35px; box-shadow: 0 10px 30px rgba(15,23,42,0.04); border: 1px solid #e2e8f0; }
        .detail-cover-container { width: 100%; height: 400px; border-radius: 16px; overflow: hidden; margin-bottom: 30px; background-color: #f1f5f9; }
        .detail-cover-container img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 2.2rem; font-weight: 800; margin: 0 0 15px 0; }
        .description { color: #475569; margin: 0; }
        .section-title { font-size: 1.4rem; font-weight: 700; margin: 40px 0 20px 0; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .album-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; transition: all 0.4s; cursor: pointer; }
        .album-card:hover { transform: translateY(-6px); border-color: var(--primary-color); }
        .album-cover-wrap { width: 100%; height: 200px; overflow: hidden; position: relative; }
        .album-cover-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .folder-badge { position: absolute; top: 12px; left: 12px; background: rgba(15,23,42,0.75); color: white; padding: 4px 10px; border-radius: 30px; font-size: 0.75rem; }
        .album-info { padding: 18px; }
        .album-name { font-size: 1.1rem; font-weight: 700; margin: 0; }
	/* 針對快閃店的相簿卡片封面圖進行微調 */
	/* first-child 代表第一個卡片 (快閃店)，若它是第二個則改為 nth-child(2) */
	.album-card:first-child .album-cover-wrap img {
	    object-position: center 20%; /* 數字越小，圖片顯示的位置越往上移 */
	}
    </style>
</head>
<body>

<a href="index.html" class="back-btn">⬅️ 返回商品列表</a>

<div class="detail-card">
    <div class="detail-cover-container">
        <img id="cover-img" src="" alt="商品封面圖" style="display: none;">
    </div>
    <h1 id="title">正在載入商品...</h1>
    <p id="desc" class="description"></p>
    
    <div class="section-title">📸 點擊進入分類相簿</div>
    <div id="gallery" class="gallery-grid"></div>
</div>

<script>
    const detailDatabase = {
        "motto": {
            coverImage: "./Motto/Motto.jpg", 
            title: "Motto (Mini Album)",
            desc: "ITZY 的第十二張迷你專輯。",
            albums: [
                { id: "popup", name: "快閃店限定相簿", cover: "./Motto/pop_up_store.jpg" },
                { id: "offline", name: "線下簽售", cover: "./Motto/motto3.jpg" }
            ]
        },
        "lightring": {
            coverImage: "./motto/lightring_1.jpg",
            title: "ITZY 官方應援棒 Ver.2",
            desc: "別具特色的環形應援燈二代！支援中控幻彩變色。",
            albums: [
                { id: "product", name: "應援棒外觀細節", cover: "./motto/lightring_1.jpg" },
                { id: "packaging", name: "官方質感外盒", cover: "./motto/lightring_box.jpg" }
            ]
        }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get('id');
    const itemData = detailDatabase[targetId];

    if (itemData) {
        if (itemData.coverImage) {
            const coverImg = document.getElementById('cover-img');
            coverImg.src = itemData.coverImage;
            coverImg.style.display = "block"; 
        }
        document.getElementById('title').innerText = itemData.title;
        document.getElementById('desc').innerText = itemData.desc;

        const galleryContainer = document.getElementById('gallery');
        itemData.albums.forEach(album => {
            const card = document.createElement('div');
            card.className = 'album-card';
            card.innerHTML = `
                <div class="album-cover-wrap">
                    <span class="folder-badge">📁 Album</span>
                    <img src="${album.cover}" alt="${album.name}">
                </div>
                <div class="album-info">
                    <h4 class="album-name">${album.name}</h4>
                </div>
            `;
            card.addEventListener('click', () => {
                window.location.href = `gallery.html?id=${targetId}&album=${album.id}`;
            });
            galleryContainer.appendChild(card);
        });
    } else {
        document.getElementById('title').innerText = "抱歉，找不到該周邊的詳細資料。";
    }
</script>
</body>
</html>
