<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZY 周邊 & 專輯搜尋庫</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
            background-color: #f9fafb;
            color: #111827;
        }

        /* 標頭與搜尋區 */
        .header-section {
            text-align: center;
            padding: 40px 0;
        }
        h1 {
            color: #e11d48; /* ITZY 常用強烈風格的桃紅/紅色系 */
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .search-container {
            margin-top: 25px;
            position: relative;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.1rem;
            border: 2px solid #e5e7eb;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
        }
        .search-input:focus {
            border-color: #e11d48;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.15);
        }

        /* 統計與標籤 */
        .status-text {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* 網格版面 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        /* 卡片外觀 */
        .item-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid #f3f4f6;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        /* 卡片圖片 */
        .img-wrap {
            width: 100%;
            height: 260px;
            background-color: #f3f4f6;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 卡片文字內容 */
        .item-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .item-type {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .type-album { background-color: #fee2e2; color: #ef4444; }
        .type-goods { background-color: #e0f2fe; color: #0284c7; }

        .item-title {
            font-size: 1.15rem;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: #1f2937;
        }
        .item-date {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 10px;
        }
        .item-desc {
            font-size: 0.9rem;
            color: #4b5563;
            line-height: 1.5;
            margin: 0;
        }

        /* 查無結果提示 */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 0;
            color: #9ca3af;
            font-size: 1.2rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="header-section">
    <h1>👑 ITZY ARCHIVE</h1>
    <p style="color: #4b5563; font-weight: 500;">專輯、周邊與官方商品即時搜尋庫</p>
    
    <div class="search-container">
        <input type="text" id="search-box" class="search-input" placeholder="輸入專輯名稱、周邊關鍵字... (如: Gold, 應援棒)">
    </div>
</div>

<div class="status-text" id="status-count">正在載入資料...</div>

<div class="grid-container" id="products-grid">
    <div id="no-data-msg" class="no-results">🔍 找不到相符的周邊或專輯資訊，換個關鍵字試試看！</div>
</div>

<script>
    // 💡 1. 在這裡建立 ITZY 的資料庫 (你可以自由新增、修改裡面的內容)
    // 圖片網址部分：為了讓你複製貼上就能直接看，我先放了網路上的公開示意圖，你之後可以換成你自己的圖片路徑（如 "images/gold.jpg"）
    const itzyDatabase = [
        {
            title: "GOLD (Mini Album)",
            type: "album",
            typeName: "官方專輯",
            date: "2024.10.15",
            desc: "ITZY 的第九張微專輯，雙主打歌〈GOLD〉與〈Imaginary Friend〉，象徵著成員們閃耀的新起點。",
            image: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&auto=format&fit=crop" 
        },
        {
            title: "BORN TO BE (Mega Album)",
            type: "album",
            typeName: "官方專輯",
            date: "2024.01.08",
            desc: "充滿爆發力與野性的專輯，收錄主打歌〈UNTOUCHABLE〉，展現 ITZY 勢不可擋的生來如此態度。",
            image: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&auto=format&fit=crop"
        },
        {
            title: "KILL MY DOUBT (Mini Album)",
            type: "album",
            typeName: "官方專輯",
            date: "2023.07.31",
            desc: "收錄夏日熱門神曲〈CAKE〉，打破所有質疑，展現充滿自信與活力的強烈舞台風格。",
            image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop"
        },
        {
            title: "Motto (Mini Album 12)",
            type: "album",
            typeName: "官方專輯",
            date: "2026.05.18",
            desc: "這張專輯傳達「與真正的自己相遇」，鼓勵人們不受外界眼光影響，堅持走自己的路",
            image: "./Motto/Motto.jpg"
        },
        {
            title: "ITZY 2ND WORLD TOUR [BORN TO BE] 官方連帽衫",
            type: "goods",
            typeName: "巡演周邊",
            date: "2024 Tour",
            desc: "世界巡迴演唱會限定周邊，正面印有巡演專屬 Logo，材質舒適，兼具日常穿搭與收藏價值。",
            image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500&auto=format&fit=crop"
        },
        {
            title: "CRAZY IN LOVE (1st Full Album)",
            type: "album",
            typeName: "正規專輯",
            date: "2021.09.24",
            desc: "ITZY 的首張正規專輯！主打歌〈LOCO〉色彩斑斕，完美展現陷入愛情時的瘋狂與大膽。",
            image: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=500&auto=format&fit=crop"
        }
    ];

    // 2. 抓取網頁上的 HTML 元素
    const searchBox = document.getElementById('search-box');
    const productsGrid = document.getElementById('products-grid');
    const statusCount = document.getElementById('status-count');
    const noDataMsg = document.getElementById('no-data-msg');

    // 3. 渲染網頁畫面的函式
    function renderItems(items) {
        // 先把舊的卡片清空（但保留「查無結果」的提示區塊）
        const cards = productsGrid.querySelectorAll('.item-card');
        cards.forEach(card => card.remove());

        // 更新統計文字
        statusCount.innerText = `目前顯示： ${items.length} 筆資料`;

        if (items.length === 0) {
            noDataMsg.style.display = 'block'; // 顯示找不到資料的提示
            return;
        }
        noDataMsg.style.display = 'none';

        // 跑迴圈，把資料一筆一筆組裝成 HTML 塞進網頁
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';

            card.innerHTML = `
                <div class="img-wrap">
                    <img src="${item.image}" alt="${item.title}">
                </div>
                <div class="item-info">
                    <span class="item-type type-${item.type}">${item.typeName}</span>
                    <h3 class="item-title">${item.title}</h3>
                    <div class="item-date">發行/開賣日期: ${item.date}</div>
                    <p class="item-desc">${item.desc}</p>
                </div>
            `;
            productsGrid.appendChild(card);
        });
    }

    // 4. 關鍵核心：監聽搜尋框的打字事件
    searchBox.addEventListener('input', (event) => {
        const keyword = event.target.value.toLowerCase().trim();

        // 使用 filter 過濾出符合標題或描述包含關鍵字的項目
        const filteredData = itzyDatabase.filter(item => {
            return item.title.toLowerCase().includes(keyword) || 
                   item.desc.toLowerCase().includes(keyword) ||
                   item.typeName.toLowerCase().includes(keyword);
        });

        // 把過濾後的乾淨資料重新畫在畫面上
        renderItems(filteredData);
    });

    // 5. 初始化：網頁一打開，先顯示所有 ITZY 資料
    renderItems(itzyDatabase);
</script>

</body>
</html>
