<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZY 周邊詳情</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto 40px auto;
            padding: 20px;
            background-color: #f9fafb;
            color: #111827;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #e11d48;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
        }
        .back-btn:hover { text-decoration: underline; }
        
        .detail-header { margin-bottom: 30px; }
        .detail-title { font-size: 2rem; color: #111827; margin-bottom: 10px; }
        .detail-desc { font-size: 1.1rem; color: #4b5563; line-height: 1.6; }

        /* 照片牆外觀 */
        .gallery-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 40px 0 20px 0;
            border-left: 4px solid #e11d48;
            padding-left: 10px;
        }
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .gallery-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #e5e7eb;
        }
        .gallery-card img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

<a href="index.html" class="back-btn">⬅️ 返回搜尋首頁</a>

<div class="detail-header">
    <h1 id="title" class="detail-title">正在載入周邊資訊...</h1>
    <p id="desc" class="detail-desc"></p>
</div>

<div class="gallery-title">📸 周邊/專輯圖片展示</div>
<div id="gallery" class="image-gallery"></div>

<script>
    // 💡 內頁也共用同一套資料庫陣列 (確保資料同步)
    const itzyDatabase = [
        {
            id: "gold",
            title: "GOLD (Mini Album)",
            desc: "ITZY 的第九張微專輯，雙主打歌〈GOLD〉與〈Imaginary Friend〉，象徵著成員們閃耀的新起點。內含寫真書、隨機小卡、CD、摺疊海報等豐富內容。",
            moreImages: ["Motto/gold_cover.jpg", "Motto/gold_photo1.jpg", "Motto/gold_photo2.jpg"] 
        },
        {
            id: "lightring",
            title: "ITZY 官方應援棒 Ver.2 (Light Ring)",
            desc: "別具特色的環形應援燈二代！支援中控幻彩變色，MIDZY 現場應援必備的發光神器。此版本優化了手把持握感，並新增了高頻閃爍模式。",
            moreImages: ["Motto/lightring_1.jpg", "Motto/lightring_2.jpg", "Motto/lightring_box.jpg"]
        }
    ];

    // 1. 抓取網址後面的參數 (例如抓取 ?id=gold 中的 gold)
    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get('id');

    // 2. 去資料庫中找出符合這個 id 的商品資料
    const currentItem = itzyDatabase.find(item => item.id === targetId);

    // 3. 把資料渲染到畫面上
    if (currentItem) {
        document.getElementById('title').innerText = currentItem.title;
        document.getElementById('desc').innerText = currentItem.desc;

        const galleryContainer = document.getElementById('gallery');
        
        // 跑迴圈把 moreImages 裡面的所有圖片路徑都印出來
        currentItem.moreImages.forEach(imgSrc => {
            const card = document.createElement('div');
            card.className = 'gallery-card';
            card.innerHTML = `<img src="${imgSrc}" alt="${currentItem.title}">`;
            galleryContainer.appendChild(card);
        });
    } else {
        document.getElementById('title').innerText = "抱歉，找不到該周邊資訊。";
    }
</script>

</body>
</html>
